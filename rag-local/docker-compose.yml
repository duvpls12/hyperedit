version: '3.9'
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: hyperedit-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: hyperedit-openwebui
    ports:
      - "3000:8080"
    environment:
      - WEBUI_AUTH=False
      - ENABLE_RAG_WEB_SEARCH=False
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://qdrant:6333
    volumes:
      - ./data/openwebui:/app/backend/data
    depends_on:
      - qdrant
    restart: unless-stopped
